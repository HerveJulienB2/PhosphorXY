name: Build VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configurer
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF "$EXTRA"

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Signature ad hoc (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "build/PhosphorXY_artefacts/Release/VST3/Phosphor XY.vst3"

      - name: Archive du plugin (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/PhosphorXY_artefacts/Release/VST3
          ditto -c -k --keepParent "Phosphor XY.vst3" "$GITHUB_WORKSPACE/PhosphorXY-macOS.zip"

      - name: Archive du plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "build/PhosphorXY_artefacts/Release/VST3/Phosphor XY.vst3" -DestinationPath PhosphorXY-Windows.zip

      - name: Archive du plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/PhosphorXY_artefacts/Release/VST3
          zip -qr "$GITHUB_WORKSPACE/PhosphorXY-Linux.zip" "Phosphor XY.vst3"

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: PhosphorXY-${{ matrix.name }}
          path: PhosphorXY-${{ matrix.name }}.zip

  # Publie les .zip sur une page de telechargement directe (sans compte GitHub necessaire).
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Creer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create latest dist/*.zip --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Phosphor XY - dernier build" \
            --notes "Telechargez le zip de votre systeme, decompressez-le, puis copiez Phosphor XY.vst3 (le dossier entier) dans votre dossier VST3."
